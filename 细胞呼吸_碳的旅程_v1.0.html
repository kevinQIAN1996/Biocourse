 let side=note('COUNT CARBON, THEN ATP',alcohol?'两个二碳，<br>加两个一碳。':'两个三碳，<br>没有 CO₂。',`<p>${alcohol?'酵母菌等可进行酒精发酵。先由三碳丙酮酸脱去 CO₂，形成二碳中间物乙醛，再还原成酒精。':'动物肌细胞等可形成乳酸；马铃薯块茎等某些植物组织也可走乳酸途径，不能把所有植物的无氧产物都说成酒精。'}</p><p class="question">后续转为酒精或乳酸，还会另外形成 ATP 吗？</p>${opts(['会，第二阶段再形成大量 ATP','不会；全程净得的 2 ATP 来自糖酵解','不会，所以全程没有 ATP'],'fanswer',state.fanswer,1)}${feedback(state.fanswer,1,'对。后续步骤帮助再生 NAD⁺，使糖酵解可以继续。','把“后续不产 ATP”与“全过程不产 ATP”分开。')}<div class="insight"><b>不要只记“缺氧”两个字</b><p>糖酵解在有氧条件下也会发生。细胞采用哪条后续途径，还取决于细胞类型和代谢状态。乳酸形成并不等于环境完全无氧。</p></div>`);
 return bench(svg(RespDraw.ferment(state.ferment,k),'葡萄糖经丙酮酸形成酒精与二氧化碳或乳酸的碳数比较'),playButton('ferment',k===3?'重新演示 ▶':'演示这条路线 ▶')+button('fnext','下一步 →','',k===3?'disabled':'')+button('freset','重置 ↻')+`<span class="status">${['起点 / 葡萄糖','糖酵解 / 净得 2 ATP','后续转化 / 不另产 ATP','产物形成 / 再生 NAD⁺'][k]}</span>`,`常见糖酵解先投入 2 ATP、后形成 4 ATP，净得 2 ATP。颜色与移动只是阶段示意，非原子机理。乳酸在细胞内通常以乳酸根形式存在。`,side,'两类常见无氧途径 / 总体碳数账',tabs)+`<div class="equation" style="margin:16px 0 0">${alcohol?'C₆H₁₂O₆ → 2 C₂H₅OH + 2 CO₂ + 少量能量':'C₆H₁₂O₆ → 2 C₃H₆O₃ + 少量能量'}<small>由相应酶催化。此处沿用高中教材“无氧呼吸”框架；严格微生物学用语中，这两类过程通常称为发酵。</small></div>`;
}
function experiment(){const p=state.exp,valid=state.scrub&&state.wait&&state.equal;let caution=[];if(!state.scrub)caution.push('A 组未去除空气 CO₂，不能把指示剂变化全部归因于酵母。');if(!state.wait)caution.push('B 组未经预培养，初期残氧及过渡期会干扰“无氧”归因。');if(!state.equal)caution.push('A 组接种量加倍，改变了供氧以外的条件，比较存在混杂。');
 const config=`<div class="experiment-config"><label class="checkline"><input data-change="scrub" type="checkbox" ${state.scrub?'checked':''}>A 组进气先通过 NaOH，吸收空气中的 CO₂</label><label class="checkline"><input data-change="wait" type="checkbox" ${state.wait?'checked':''}>B 组先封口预培养，模型假定观察窗开始时残氧已耗尽</label><label class="checkline"><input data-change="equal" type="checkbox" ${state.equal?'checked':''}>保持同批酵母、接种量、糖浓度、体积、温度和观察时段一致</label></div>`;
 const side=note('OBSERVATION ≠ CONCLUSION','先看现象，<br>再审查证据。',`<p>${['准备装置，先预测两组是否都能产生 CO₂。取消一个条件，试试会影响哪条推论。','模拟培养：A 持续供气；B 不主动补气。气泡只示意有气体通过，不是气量计。','两组 BTB 由蓝趋黄。本模型排除其他酸碱干扰，指示 CO₂ 进入试剂。','另取培养液检测酒精：B 出现灰绿色；A 在本次预设中低于检测限。'][p]}</p>${caution.length?`<p class="feedback bad">${caution.join('<br>')}</p>`:'<p class="feedback">✓ 对比条件已具备；结论仍须结合检测和模型假设。</p>'}<p class="question">仅凭两组 CO₂ 检测均为阳性，能判断呼吸方式吗？</p>${opts(['能，有 CO₂ 就是有氧呼吸','不能，两条酵母分解途径都可产生 CO₂','能，气泡较少就是纯无氧呼吸'],'eanswer',state.eanswer,1)}${feedback(state.eanswer,1,'正确。还要结合供氧条件、酒精等指标及合适空白。','气体的存在与形成它的途径不是一一对应。')}<div class="insight"><b>${valid?'结论的适用范围':'当前设计有待改进'}</b><p>${valid?'这组预设结果支持缺氧观察阶段发生酒精发酵。不能由此推广为“有氧酵母永不发酵”；菌株、糖浓度和供氧等都会影响结果。':'请先指出控制缺口，再解释它影响了哪条结论。产物信号可能仍然出现，但证据不够充分。'}</p></div>`);
 return bench(svg(RespDraw.experiment(p,state),'持续供氧组经NaOH洗气、酵母培养液、BTB，密封组先预培养，另取培养液检测酒精'),playButton('experiment',p===3?'重新观察 ▶':'运行模拟 ▶')+button('enext','下一步观察 →','',p===3?'disabled':'')+button('ereset','重置观察 ↻')+`<span class="status">${p+1} / 4 · ${['准备','培养','检验 CO₂','检验酒精'][p]}</span>`,`固定的定性情境，不是实验记录。A 组设定供氧适宜、糖条件下酒精低于本次检测限，并非绝对为零。BTB 是 pH 指示剂；两组颜色不用于定量比较 CO₂ 或呼吸速率。`,side,'酵母菌对比实验 / 培养与检测分开',config)+`<details><summary>实验解释卡：每一步排除了什么？</summary><p>NaOH 放在培养瓶上游，吸收进气原有的 CO₂，不去除 O₂；NaOH 不能进入培养液。若放在培养瓶下游，会吸收需要检测的 CO₂。长进气管深入液体、短出气管取上部气体；BTB 检验与另取培养液检测酒精分开。</p><p>封口不代表瞬间无氧；预培养用于减少残氧干扰，本模型只解释之后的观察窗，不把预培养阶段的所有气体都算作无氧产物。真实实验需结合气路空白、试剂空白及合适的阳性对照，排查漏气、试剂状态与其他还原性物质干扰。</p><p>取消最后一项时，本情境把 A 组接种量加倍，其余不变。无论是否保持一致，画面都不生成虚构的毫升数或速率曲线；若要比较真实速率，须取得可靠的时间、底物消耗和气体收集数据。</p></details>`;
}
const cases=[
 {tag:'01 / POSTHARVEST',name:'果蔬保鲜库',hint:'氧气越少，保存越好吗？',title:'库里的果实，依旧是活的。',body:'一种果实在适宜低温、适度低氧条件下呼吸减弱。有人建议把氧彻底除尽、长期密封，认为这样就能“零消耗”。',q:'怎样评价这个方案？',choices:['可以，所有活细胞只要无氧就停止代谢','应控制在适宜范围，长期严重缺氧可能引起发酵和品质变化','温度越低越好，所有果实都应冰冻'],answer:1,why:'适度抑制呼吸可减少有机物消耗；但严重缺氧可能引起酒精发酵，过低温也可能损伤某些果实。具体条件取决于品种，不能给所有果蔬一套数值。'},
 {tag:'02 / FERMENTATION',name:'酵母发酵罐',hint:'有氧，就一定没酒精吗？',title:'气泵开着，证据仍需检测。',body:'同学在连续通气的酿酒酵母培养体系里检测到了酒精。仅因为“通了气”，另一位同学就判定检测必定出错。',q:'哪种解释更严谨？',choices:['有酒精就证明整个装置从始至终无氧','有气泵就证明每个细胞都只进行有氧呼吸','需核查供氧、糖浓度和检测条件；某些酵母在有氧高糖条件下也可发酵'],answer:2,why:'培养条件不是呼吸途径的直接开关。通气、溶氧、细胞状态和菌株都会影响代谢；酒精阳性支持存在酒精发酵，但不排除同时有有氧呼吸。'},
 {tag:'03 / MUSCLE CELLS',name:'运动肌细胞',hint:'乳酸是永远堆着的废物？',title:'短时供能，不只有一条路。',body:'运动时肌细胞的 ATP 需求迅速增加。糖酵解和乳酸生成可增加，但这不意味着细胞完全没有氧，也不意味着有氧呼吸停止。',q:'乳酸途径中，后续反应的重要意义是？',choices:['再生 NAD⁺，使糖酵解继续形成少量 ATP','把所有有机物变成 CO₂ 和水','给第二阶段额外制造大量 ATP'],answer:0,why:'丙酮酸接受还原力形成乳酸，使 NADH 再氧化为 NAD⁺。乳酸也可继续被代谢利用，不能把次日酸痛简单归因于乳酸堆积。'},

function review(){const q=RespContent.quiz[state.quiz],answer=state.answers[state.quiz];return `<div class="wide-layout"><div class="brief"><span class="eyebrow">ONE GLUCOSE · THREE OUTCOMES</span><h2 style="font-size:26px;font-weight:500;margin:10px 0">分解有机物，释放能量。</h2><p class="small">共同起点是糖酵解；后续路线决定碳的去向与 ATP 的形成特点。</p><div class="summary-grid"><div class="summary-card"><b>有氧呼吸</b><p>细胞质基质 → 线粒体<br>彻底氧化 → CO₂ 和水<br>形成较多 ATP</p></div><div class="summary-card"><b>酒精途径</b><p>细胞质基质<br>酒精 + CO₂<br>全程净得 2 ATP</p></div><div class="summary-card"><b>乳酸途径</b><p>细胞质基质<br>乳酸，无 CO₂<br>全程净得 2 ATP</p></div></div><div class="callout">请学生用一句话解释：<br><b>“O₂ 并不是用来直接把碳变成 CO₂ 的。”</b></div><details><summary>展开本课结论与边界</summary><p>① 物质的变化要结合位置：第一阶段细胞质基质、教材第二阶段线粒体基质、第三阶段内膜。<br>② O₂ 的直接还原产物是水，CO₂ 在教材第二阶段产生。<br>③ 部分能量联系 ATP 合成，部分以热等形式散失；ATP 图标数量不是实际总产量。<br>④ 两类发酵都不彻底分解有机物，后续步骤主要再生 NAD⁺；ATP 来自糖酵解。<br>⑤ 观察 CO₂ 不足以单独区分酵母的呼吸方式，应结合条件与其他检测证据。</p><p>本课只选常见途径。严格微生物学中的“厌氧呼吸”还包括利用电子传递链、以非氧物质作最终电子受体的过程，与这里的发酵机制不同。</p></details><p class="small">全为原创情境题，不标为湖北或其他省份高考原题。计算题为题干限定条件下的理想模型。</p></div><div class="quiz-box">${state.finished?`<span class="eyebrow">MISSION COMPLETE</span><h2>完成八次证据判断。</h2><p>本轮答对 ${state.answers.filter((a,i)=>a===RespContent.quiz[i].answer).length} / ${RespContent.quiz.length} 题。</p><p style="font-size:13px;color:#53716b">请任选一题，由学生解释“错误选项错在哪里”。</p>${button('quizreset','重新挑战 ↻')}`:`<span class="eyebrow">课堂挑战 / ${state.quiz+1} OF ${RespContent.quiz.length}</span><h3>${escape(q.stem)}</h3>${opts(q.options.map(escape),'quizanswer',answer,q.answer)}${answer!==null?`<p class="feedback ${answer===q.answer?'':'bad'}">${answer===q.answer?'✓ 判断正确。':'正确选项：'+String.fromCharCode(65+q.answer)+'。'} ${escape(q.explanation)}</p>`:'<p class="feedback">先独立判断，再请同伴说明依据。</p>'}<div class="quiz-buttons">${button('quizprev','← 上一题','',state.quiz===0?'disabled':'')}${button('quiznext',state.quiz===RespContent.quiz.length-1?'查看完成情况 →':'下一题 →','',answer===null?'disabled':'')}</div><div class="answer-counter">${state.answers.map((a,i)=>`<span class="done-dot ${a!==null?'done':''}" title="第${i+1}题"></span>`).join('')}</div>`}</div></div>`;}

function play(mode){if(playing===mode){stop();render();return;}stop();const key={aerobic:'aerobic',ferment:'fstep',experiment:'exp'}[mode];if(state[key]===3)state[key]=0;playing=mode;render();timer=setInterval(()=>{state[key]=Math.min(3,state[key]+1);if(mode==='aerobic')state.location=null;if(state[key]===3)stop();render();},3400);}
function showDialog(kind){stop();render();const teacher=kind==='teacher';$('#dialogKicker').textContent=teacher?'TEACHER’S ROUTE MAP':'SCIENCE & MODEL NOTES';$('#dialogTitle').textContent=teacher?'让每次操作，都有一句解释。':'依据、来源与简化边界';const st=stages[state.stage];$('#dialogBody').innerHTML=teacher?`<p class="callout">当前环节：${st.short}<br>${st.prompt}</p><h3>建议 2 课时，共约 80 分钟</h3><p>第一课时：总览、有氧与无氧路线；第二课时：实验、应用与挑战。也可择取环节用于复习，不要求一次讲完。</p><div class="pace">${stages.map(s=>`<div><b>${s.short}</b><span>建议 ${s.time} 分钟</span></div>`).join('')}</div><h3>三人协作，轮流上台</h3><ol><li>操作员：先说预测，再点击、改变条件或推进动画。</li><li>追踪员：指出反应区室，数清碳数，追踪氧气的直接去向。</li><li>解释员：把现象变成有条件的结论，指出模型没有证明的部分。</li></ol><h3>本课目标</h3><ul><li>描述有氧呼吸的三个阶段及主要场所，联系物质变化与 ATP 形成。</li><li>比较两类常见无氧途径的产物、ATP 来源与碳数。</li><li>设计与审查酵母菌对比实验，区分观察、解释与过度推论。</li></ul><details><summary>科学教学提示</summary><ol>${RespContent.teacherNotes.map(s=>`<li>${escape(s)}</li>`).join('')}</ol></details><p class="small">左右方向键切环节；焦点位于控件、文本选择或对话框中时保留原有键盘功能。切环节、打开资料或切到后台时，自动演示暂停。学习记录只在本次打开期间保留。</p>`:`<p class="callout">${escape(RespContent.scopeNote)}</p><h3>模型是什么，省略了什么？</h3><ul><li>全部图形与动画均为原创二维教学示意，非电子显微照片或原子结构模型。参考国外互动教学的“总览—局部—证据”组织方式，未复制其动画或图片。</li><li>碳点是总体碳数记账，不逐个追踪真实原子在三羧酸循环中的位置；圆点大小、动画秒数、ATP标签都不是测量数据。</li><li>三阶段图以真核细胞为对象。教材第二阶段包含丙酮酸氧化与三羧酸循环；第三阶段概括内膜上的电子传递及与ATP合成的耦联。</li><li>阶段式省略系数、部分底物和中间物；[H]代表相关还原性载体携带的还原力，不能当作H₂。完整净反应已配平；水的净系数与原子来源不能混为一谈。</li><li>发酵后续反应再生NAD⁺，不再额外形成ATP。课内常见糖酵解模型每葡萄糖净得2ATP；不将有氧产量固定为一个通用整数。</li><li>酵母试验是预设的定性情境：A组酒精低于本次检测限；B组有CO₂和酒精信号。未建真实生长动力学、检出限曲线或CO₂速率模型。有氧条件不排除某些酵母发生酒精发酵。</li><li>酸性重铬酸钾在适当对照下用于酒精检测，也可受其他还原性物质干扰；BTB为pH指示剂，本模型假定其变化来自CO₂。实际实验需按学校规范进行。</li></ul><h3>教材与科学资料</h3><ul class="reference-list">${RespContent.references.map(r=>`<li><a href="${r.url}" target="_blank" rel="noopener">${escape(r.title)} ↗</a><small>${escape(r.note)}</small></li>`).join('')}<li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC184133/" target="_blank" rel="noopener">Postma 等 · 酿酒酵母有氧代谢与 Crabtree 效应 ↗</a><small>原始研究；核对“有氧”与“绝不产生酒精”不能画等号。</small></li><li><a href="https://ucanr.edu/datastoreFiles/608-411.pdf" target="_blank" rel="noopener">UC ANR · 果蔬采后品质与控制气氛 ↗</a><small>核对适度控制氧气与严重缺氧导致发酵的不同后果，不据此给所有果实同一套储藏参数。</small></li></ul><h3>优秀教学案例 · 推荐教师联网拓展</h3><ul class="reference-list"><li><a href="https://www.biointeractive.org/classroom-resources/cellular-respiration-hub" target="_blank" rel="noopener">HHMI BioInteractive · Cellular Respiration Hub ↗</a><small>参考全局路线与局部机制相互联系的学习组织。原资源与本课件独立，未嵌入其图片或动画。</small></li><li><a href="https://www.wehi.edu.au/wehi-tv/respiration-teacher-resources/" target="_blank" rel="noopener">WEHI TV · Respiration teacher resources ↗</a><small>可作课后分子尺度拓展，细节超出本课必修范围。</small></li><li><a href="https://learn.genetics.utah.edu/content/metabolism/pathways/" target="_blank" rel="noopener">University of Utah · Metabolic Pathways ↗</a><small>参考代谢区室、燃料与细胞类型相联系的可视化组织。</small></li></ul><p class="small">正文、问题与二维图形原创。单文件离线运行，资料链接仅供联网查阅；未嵌入外部运行资源。新建独立 v1.0，已有课件全部保留。</p>`;$('#infoDialog').showModal();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const act=el.dataset.act,v=el.dataset.value,n=Number(v);switch(act){case'stage':goto(n);return;case'prev':goto(state.stage-1);return;case'next':goto(state.stage+1);return;case'goto-aerobic':goto(1);return;case'goto-ferment':goto(2);return;case'teacher':case'sources':showDialog(act);return;case'close':$('#infoDialog').close();return;case'classroom':state.classroom=!state.classroom;document.body.classList.toggle('classroom',state.classroom);$('#classButton').textContent=state.classroom?'退出投屏 ↙':'投屏模式 ⤢';$('#classButton').setAttribute('aria-pressed',state.classroom);return;case'route':state.route=v;break;case'astep':stop();state.aerobic=n;state.location=null;break;case'anext':stop();state.aerobic=Math.min(3,state.aerobic+1);state.location=null;break;case'areset':stop();state.aerobic=0;state.location=null;break;case'location':state.location=n;break;case'ferment':stop();state.ferment=v;state.fstep=0;state.fanswer=null;break;case'fnext':stop();state.fstep=Math.min(3,state.fstep+1);break;case'freset':stop();state.fstep=0;break;case'fanswer':state.fanswer=n;break;case'enext':stop();state.exp=Math.min(3,state.exp+1);break;case'ereset':stop();state.exp=0;state.eanswer=null;break;case'eanswer':state.eanswer=n;break;case'case':state.case=n;break;case'caseanswer':state.caseAnswers[state.case]=n;break;case'quizanswer':state.answers[state.quiz]=n;break;case'quiznext':if(state.quiz<RespContent.quiz.length-1)state.quiz++;else state.finished=true;break;case'quizprev':state.quiz=Math.max(0,state.quiz-1);break;case'quizreset':state.quiz=0;state.answers.fill(null);state.finished=false;break;default:if(act.startsWith('play-')){play(act.slice(5));return;}}render();});
document.addEventListener('change',e=>{const key=e.target.dataset.change;if(!key)return;state[key]=e.target.checked;if(key!=='oxygen'){stop();state.exp=0;state.eanswer=null;}render();});
document.addEventListener('keydown',e=>{if($('#infoDialog').open||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||/^(INPUT|TEXTAREA|SELECT|BUTTON|A|SUMMARY)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable||window.getSelection()?.toString())return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();goto(state.stage+(e.key==='ArrowRight'?1:-1));}});
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('pause-motion',document.hidden);if(document.hidden&&playing){stop();render();}});render();
})();
</script></body></html>
