<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基因重组 · 配子组合印刷所</title><style>
*{box-sizing:border-box}body{margin:0;background:#131c23;color:#f2eee6;font:17px/1.7 system-ui,"Microsoft YaHei",sans-serif;--accent:#b6c4ff}main{max-width:1050px;margin:auto;padding:5vw 5vw 70px}header,section,details{border-bottom:1px solid #49535a;padding:22px 0}small{color:var(--accent);letter-spacing:2px}h1{font-family:serif;font-size:clamp(34px,6vw,66px);margin:8px 0}h2{font-size:24px}button,input{font:inherit;padding:9px 14px;border:1px solid #71828c;border-radius:8px;margin:4px;background:#24333e;color:white}button,summary{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}figure{margin:16px 0;padding:24px;background:#202e38;border-radius:16px;border-left:4px solid var(--accent)}#picture{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:90px}.tile{background:var(--accent);color:#14202a;font:bold 22px monospace;padding:10px 16px;border-radius:8px;animation:appear .35s ease-out}@keyframes appear{from{transform:translateY(7px);opacity:.3}}figcaption{color:#d6e1e6}#award{border:2px double var(--accent);padding:18px;text-align:center}p{max-width:75ch}</style><main><header><small>生物教学手记 ／ 必修 2 · 05-01</small><h1>配子组合印刷所</h1><b>基因重组</b></header><section><small>01 ／ 操作与观察</small><h2>两个亲本没有的组合，怎样进入配子？</h2><p>模型为 AaBb。先观察两对非同源染色体的取向，再把两个标记放到同一对染色体上。</p><figure><div id="picture"></div><figcaption id="result" aria-live="polite"></figcaption></figure><div id="actions"></div></section><section><small>02 ／ 用证据作答</small><h2>互换形成了 Ab 配子，哪项发生改变？</h2><div id="answers"></div><p id="feedback" role="status"></p></section><details><summary>展开本节知识手记</summary><p>减Ⅰ前期同源染色体非姐妹染色单体可发生互换。减Ⅰ后期非同源染色体自由组合。每次模拟只追踪一个精母细胞形成的四个产物。</p></details><section id="reward" hidden><small>03 ／ 课堂纪念</small><p><label>署名 <input id="student" maxlength="24"></label><button id="issue">领取本课奖状</button></p><p id="award" hidden></p></section></main><script>
const get=id=>document.getElementById(id);
const type="recomb", labels=["独立分配 · 取向一","独立分配 · 取向二","连锁 · 无互换","连锁 · 一次互换"], quiz=["互换形成了 Ab 配子，哪项发生改变？",["出现新的等位基因","已有等位基因的组合","染色体组数翻倍"],1,"基因重组重新组合已有遗传信息。突变才可能产生新等位基因。"];
let pairs='',last=-1;
function show(tiles,message){get('picture').replaceChildren(...tiles.map(value=>{const span=document.createElement('span');span.className='tile';span.textContent=value;return span}));get('result').textContent=message}
function operate(n){
 if(type==='dna'){const template='TACG',target='ATGC';if(n===4)pairs='';else if(labels[n]===target[pairs.length])pairs+=labels[n];else{get('result').textContent=pairs.length===4?'配对已完成，可重置再次拼装。':'观察尚未配对的第 '+(pairs.length+1)+' 个模板碱基，再选一次。';return}show([...template].map((v,j)=>v+'／'+(pairs[j]||'□')),pairs.length===4?'模板 3′-TACG-5′，互补链 5′-ATGC-3′。试着算一算共有多少个氢键。':'上链 3′ → 5′，下链 5′ → 3′。从左向右补齐下链。');return}
 if(type==='gene'){if(n===3&&last<0){show(['甲','乙','丙'],'先删除一个片段，再做回补。');return}const activity=[98,8,101,100][n];show(['对照 100', '实验 '+activity],n===3?'原位回补片段'+['甲','乙','丙'][last]+'后，酶活性恢复至对照水平。':'模拟相对酶活性。对照做相同操作但保留片段。请比较哪次变化最明显。');last=n===3?-1:n;return}
 if(type==='trait'){show(['相同基因型','酶活性'+['高','中','低'][n],'新毛'+['深褐','浅褐','浅色'][n]],'观察新长出的毛发。温度影响温敏酶活性，进而影响黑色素积累。');get('picture').lastChild.style.background=['#75482f','#bc9470','#f4dfbc'][n];get('picture').lastChild.style.color=n===0?'white':'black';return}
 if(type==='recomb'){show([['AB','AB','ab','ab'],['Ab','Ab','aB','aB'],['AB','AB','ab','ab'],['AB','Ab','aB','ab']][n],['A 与 B 移向同一极，两个次级细胞各产生两个同型产物。','只翻转第二对同源染色体的取向，观察与第一次的区别。','两个标记连锁，亲本排列为 AB／ab。','两个位点间发生一次非姐妹染色单体互换，四个产物中两个为重组型。'][n]);return}
 show([['随机抽样','12 / 2400','0.5%'],['患者家系','12 / 48','25%'],['人群 0.5%','家系 25%']][n],['分母包括全部被调查者，患病率估计为 12÷2400。','家系通过患者入组，近亲共享部分遗传信息。','取样方式改变了分母的组成。解释为什么不能用 25% 推及全体人群。'][n])}
function controls(id,items,fn){items.forEach((label,n)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>fn(n);get(id).append(b)})}
controls('actions',type==='dna'?[...labels,'重新拼装']:labels,operate);
show(["AaBb","→","四个产物"],'先做预测，再用下方按钮改变实验条件。');
controls('answers',quiz[1],n=>{get('feedback').textContent=n===quiz[2]?'推理成立。'+quiz[3]:'再观察一次。'+quiz[3];if(n===quiz[2])get('reward').hidden=false});
get('issue').onclick=()=>{const name=get('student').value.trim();get('award').hidden=false;get('award').textContent=name?'恭喜'+name+'完成《配子组合印刷所》探究，获得本课观察员奖状。':'请先填写署名。'};
</script></html>
