function bezier(aa,bb,offset=0) {

  const s=c.series[0];
  return '<table><thead><tr><th scope="col">处理</th>'+f.axis.map(a=>'<th scope="col">'+esc(a)+'</th>').join('')+'</tr></thead><tbody>'+
  (s.replicates?range(s.replicates[0].length).map(i=>'<tr><th scope="row">插条 '+(i+1)+'</th>'+s.replicates.map(g=>'<td>'+fmt(g[i])+'</td>').join('')+'</tr>').join(''):'')+
  c.series.map(s=>'<tr><th scope="row">'+esc(s.name||'模型读数')+'</th>'+s.y.map((v,i)=>'<td>'+fmt(v)+(s.sd?' ± '+fmt(s.sd[i]):'')+'</td>').join('')+'</tr>').join('')+
  '</tbody></table>';
}
const panels=LESSON.figures.map((f,index)=>{
  const k=index+1, el=document.createElement('section');
  el.className='figure';el.id='figure'+k;el.setAttribute('aria-labelledby','head-'+k);
  el.innerHTML='<div class="figure-head"><span class="folio">FIGURE '+f.id+'</span><h2 id="head-'+k+'">'+esc(f.title)+'</h2><a class="refjump" href="#ref-1" aria-label="跳到教材来源">[1]</a></div><p class="question"><strong>先预测</strong>'+esc(f.ask)+'</p>'+
    '<div class="choices" role="group" aria-label="比较条件">'+f.cases.map((c,i)=>'<button type="button" data-case="'+i+'" aria-pressed="'+(i===0)+'">'+esc(c.name)+'</button>').join('')+'</div>'+
    '<div class="plate"><div class="pane"><div class="panetitle"><span><b>A</b>机制图</span><span class="aside hint">大图可横向查看</span></div><div class="svgscroll scene" tabindex="0" aria-label="机制示意图"></div></div>'+
    '<div class="pane"><div class="panetitle"><span><b>B</b>证据图</span><span class="aside">课堂模型 / 定性记录</span></div><div class="svgscroll chart" tabindex="0" aria-label="统计证据图"></div><p class="model">'+esc(f.bound)+' <a href="#ref-2">[资料]</a></p><p class="rline"></p></div></div>'+
    '<div class="control"><button class="play" type="button">播放过程</button><button class="reset" type="button">复位</button><label class="range"><span>分镜进度</span><input type="range" min="0" max="1000" value="0" aria-label="分镜进度"><output>0%</output></label></div>'+
    '<div class="reading"><div class="readbox"><strong>当前观察</strong><span class="obs"></span></div><div class="readbox"><strong>用证据解释</strong><span class="claim"></span></div></div>'+
    '<details class="fig-extra"><summary>读数记录与本图小结</summary><p>'+esc(f.take)+'</p><div class="raw"></div></details>';
  $('#figures').append(el);
  const local=s=>el.querySelector(s), slider=local('input'), output=local('output'), play=local('.play');
  let ci=0,lastBand=-1;
  const clock=BioAtlas.createTimeline({duration:10,render(t){
    const c=f.cases[ci];
    local('.scene').innerHTML=makeScene(f,c,ci,t);local('.chart').innerHTML=drawChart(f,c,ci,t);
    const band=t===0?0:t<.68?1:2;
    if(lastBand!==band){
      local('.obs').textContent=band===0?'选中「'+c.name+'」。先预测，再播放或拖动。':c.see;
      local('.claim').textContent=band<2?'比较两图的路径、读数和对照，再解释原因。':c.infer;
      lastBand=band;
    }
  },onState({t,playing}){
    slider.value=Math.round(t*1000);slider.setAttribute('aria-valuetext',Math.round(t*100)+'%');
    output.textContent=Math.round(t*100)+'%';play.textContent=playing?'暂停':t===1?'重看过程':'播放过程';
    play.setAttribute('aria-pressed',String(playing));
  }});
  function updateChoice(){local('.raw').innerHTML=rows(f,f.cases[ci]);local('.rline').textContent='ggplot(aes(x, y)) + '+(f.plot==='bar'?'geom_col()'+(f.cases[ci].series[0].sd?' + geom_errorbar()':''):'geom_line() + geom_point()')+' + facet_wrap(~ 指标) + theme_'+document.documentElement.dataset.theme+'()'}
  updateChoice();
  el.querySelectorAll('[data-case]').forEach(btn=>btn.onclick=()=>{
    ci=Number(btn.dataset.case);el.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
    lastBand=-1;clock.reset();updateChoice();
  });
  slider.oninput=()=>clock.seek(Number(slider.value)/1000);
  play.onclick=()=>clock.state.playing?clock.pause():clock.play();
  local('.reset').onclick=()=>clock.reset();
  return {refresh(){local('.chart').innerHTML=drawChart(f,f.cases[ci],ci,clock.state.t);updateChoice()}};
});
</script>
</body>
</html>
