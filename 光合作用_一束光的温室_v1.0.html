function theaterRoom(){const [q,options,answer,why]=stageQuestions[s.step],chosen=s.stepsAnswers[s.step];return heading('03','一片叶绿体，两段相连的工作。','沿着四个场景推进。让一位同学操作，另一位指出“场所—物质—能量”的联系。')+`<div class="theater"><div class="theater-top"><div class="stage-buttons">${['结构总览','光反应','CO₂ 固定','还原与再生'].map((t,i)=>btn('step',t,'',`data-n="${i}" aria-pressed="${s.step===i}"`)).join('')}</div><span>${btn('play',s.playing?'暂停 Ⅱ':'按顺序演示 ▶','small-button',`aria-pressed="${s.playing}"`)}</span></div>${svg(PhotoScene.chloroplast(s.step,{animate:s.playing}),'0 0 1000 570','叶绿体膜结构、光反应、二氧化碳固定与还原再生的分区','chloroplast')}<div class="theater-bottom"><div class="theater-caption"><span class="label">SCENE 0${s.step+1}</span><h3>${stageText[s.step][0]}</h3><p>${stageText[s.step][1]}</p></div><div class="theater-question"><p class="question">${q}</p>${choice(options,'stage-answer',chosen,answer)}${chosen!==null?`<p class="mini-note">${chosen===answer?'✓ 解释正确。':'再对照图中箭头。'}${why}</p>`:''}</div></div></div><div class="equation">光反应：类囊体薄膜　⇄　暗反应：叶绿体基质<small>“暗反应”在这里指卡尔文循环 / 碳反应，不是“夜间专属”。正常情况下依赖光反应持续提供ATP与NADPH；完全断光后不能长期按原速率运行。</small></div><details><summary>进阶碳账：为何不是固定一次，就输出一分子葡萄糖？</summary><p>固定 3 个 CO₂，形成 6 个三碳中间物。经还原后，相当于净输出 1 个三碳糖磷酸，其余 5 个三碳单位用于再生 3 个 C₅。三碳糖磷酸可进一步参与糖类等有机物合成。真实过程有多步酶促反应，图中箭头只表示物质联系，未按分子比例、反应次数或真实时间绘制。</p><p>ATP、NADPH在这里的主要流向是基质碳同化；不能把叶绿体光反应的ATP画成所有细胞活动都可直接使用的无限公共电池。绿色植物也同时进行细胞呼吸。</p></details>`;}
function evidenceRoom(){const prediction=['A 组的产氧明显富集 ¹⁸O','B 组的产氧明显富集 ¹⁸O','两组一定得到相同富集'];return heading('04','释放的氧，究竟来自谁？','总反应式告诉你“有氧产生”，同位素对照才能帮助追踪氧原子的来源。先作预测，再揭示观察。')+`<div class="evidence-grid"><article class="evidence-card"><h3><span>GROUP A</span>只把水的氧富集标记</h3>${svg(PhotoDraw.isotope(0,s.evidence),'0 0 580 400','A组用富集氧18的水和普通二氧化碳进行短时示踪','evidence-svg')}</article><article class="evidence-card"><h3><span>GROUP B</span>只把 CO₂ 的氧富集标记</h3>${svg(PhotoDraw.isotope(1,s.evidence),'0 0 580 400','B组用普通水和富集氧18的二氧化碳进行短时示踪','evidence-svg')}</article></div><div class="prediction"><p class="question">只比较新释放的 O₂，哪一组会出现明显的额外 ¹⁸O 富集？</p>${choice(prediction,'prediction',s.prediction,0,'',s.evidence)}<div class="action-row" style="justify-content:center">${btn('reveal-evidence','揭示观察 →','primary',s.prediction===null||s.evidence?'disabled':'')}${btn('reset-evidence','再推理一次 ↻')}</div>${s.evidence?`<p class="feedback ${s.prediction===0?'':'wrong'}">${s.prediction===0?'✓ 预测与证据相符。':'证据提示修正预测。'}新释放的氧随水的标记而富集，支持放氧光合作用释放的 O₂ 来自水。光提供能量，并不变成氧原子。</p>`:'<p class="mini-note">¹⁸O 是稳定同位素，不是放射性同位素。两组应保持其他适宜条件可比。</p>'}</div><div class="evidence-conclusion"><b>¹⁸O</b><p>这是基于氧同位素示踪逻辑的定性教学再现，不是某次历史实验的原始记录。对比短时新释放的 O₂，简化了背景氧、后期水与CO₂间同位素交换及取样问题；“富集”不表示采样气体是100%纯¹⁸O₂。标记水中的氧也并非全部都进入释放的O₂。<br>研究思路：先提出来源假说，再选择可区分假说的标记对照。</p></div>`;}
function greenhouseRoom(){return heading('05','经营温室，先看“净收入”。','先保持其他条件不变，只改变一个变量。你看到的是一个虚拟植物模型，不是实际作物的种植配方。')+`<div class="greenhouse"><aside class="controls"><span class="label">CONDITIONS / 相对档位</span><h3 style="margin:10px 0 0">改变一个条件。</h3><div class="controls-grid"><div class="control"><label for="lightRange">相对光强 <output id="lightOutput">${s.L}</output></label><input id="lightRange" data-param="L" type="range" min="0" max="100" step="1" value="${s.L}"></div><div class="control"><label for="carbonRange">CO₂ 供应档位 <output id="carbonOutput">${s.C}</output></label><input id="carbonRange" data-param="C" type="range" min="0" max="100" step="1" value="${s.C}"></div></div><div class="control"><label>虚拟温度条件</label><div class="temperature">${[['cool','偏低'],['fit','适宜'],['hot','偏高']].map(([k,t])=>btn('temperature',t,'',`data-key="${k}" aria-pressed="${s.T===k}"`)).join('')}</div></div><p>温度改变本模型的光合容量和呼吸设定，不代表所有植物共用一个最适温度。</p>${btn('dark','关灯试试')}${btn('greenhouse-reset','恢复条件','', 'style="margin-left:7px"')}<p id="limitText"></p></aside><div class="chart-paper"><div class="chart-legend"><span><i></i>净光合</span><span><i style="background:var(--yellow)"></i>总光合（虚线）</span><span>● 当前光强</span></div><div id="exchangeChart"></div><div class="metric-equation" id="metrics"></div><p class="mini-note">所有速率都是整数相对单位；整条光响应曲线固定当前CO₂与温度，只改变相对光强。无光时总光合为0，但叶片呼吸仍在。</p></div></div><div class="greenhouse-tasks">${btn('task','挑战一：找到补偿点','',`data-n="1" aria-pressed="${s.task===1}"`)}${btn('task','挑战二：加光没用，怎么办？','',`data-n="2" aria-pressed="${s.task===2}"`)}${btn('record','记录当前条件','',s.records.length>=6?'disabled':'')}${btn('clear-records','清空记录')}</div><p class="feedback" id="taskFeedback"></p><div class="record-area" id="records"></div><details><summary>模型说明：曲线从哪里来？哪些过程没有模拟？</summary><p>模型设光照容量＝0.16×相对光强，CO₂容量＝0.16×供应档位。偏低/适宜/偏高温度的容量分别设为7/14/9，呼吸设为1/2/4；总光合取三个容量中的最小值并四舍五入，净光合＝总光合−呼吸。它是可检查的教学规则，不是拟合真实物种的生理模型；曲线的台阶来自整数显示。</p><p>采用同一叶片、同一时段、同一CO₂计量基准，省略光呼吸、内部CO₂再固定、气孔动态、强光抑制与长期适应。CO₂供应档位为0时，本模型总光合为0；真实植物还涉及内部碳源与交换。补偿点净值0不表示光合或呼吸停止；黑暗呼吸值也不能无条件代替真实光下呼吸值。</p></details>`;}
function updateGreenhouse(){if(s.room!==4)return;const a=PhotoDraw.exchange({light:s.L,carbon:s.C,temperature:s.T});$('#lightOutput').textContent=s.L;$('#carbonOutput').textContent=s.C;$('#exchangeChart').innerHTML=svg(PhotoDraw.chart({light:s.L,carbon:s.C,temperature:s.T}),'0 0 800 400','固定当前二氧化碳供应和温度条件的总光合与净光合模型曲线');$('#metrics').innerHTML=`<div><b>${a.gross}</b><small>总光合固定 CO₂</small></div><span>−</span><div><b>${a.respiration}</b><small>呼吸释放 CO₂</small></div><span>＝</span><div><b style="color:${a.net<0?'var(--coral)':'var(--green)'}">${a.net}</b><small>净值 / ${a.net>0?'净吸收':a.net<0?'净释放':'净交换为零'}</small></div>`;$('#limitText').textContent='当前模型中限制最明显的条件：'+a.limit+'。';let msg='先记录一组，再只改变一个条件，比较净值的变化。';if(s.task===1)msg=a.net===0&&a.gross>0?'✓ 找到了模型的补偿状态：总光合仍在进行，恰好补偿呼吸。':'挑战一：只改变光强，把净光合调到 0；同时说明总光合是否也为 0。';if(s.task===2)msg=a.net>=10?'✓ 净光合达到 10 个相对单位。请比较哪一次操作真正提高了平台。':'挑战二：初始光强很高但 CO₂ 很低。先试继续加光，再改变一个限制条件，让净光合达到 10。';$('#taskFeedback').textContent=msg;$('#records').innerHTML=s.records.length?`<h3>温室观察簿 <small style="font-weight:400;color:var(--muted)">最多6条 · 虚拟模型输出</small></h3><table class="record-table"><thead><tr><th>记录</th><th>光强</th><th>CO₂档位</th><th>温度</th><th>总光合</th><th>呼吸</th><th>净值</th></tr></thead><tbody>${s.records.map((a,i)=>`<tr><td>0${i+1}</td><td>${a.light}</td><td>${a.carbon}</td><td>${{cool:'偏低',fit:'适宜',hot:'偏高'}[a.temperature]}</td><td>${a.gross}</td><td>${a.respiration}</td><td>${a.net}</td></tr>`).join('')}</tbody></table>`:'';}
function salonRoom(){const q=PhotoContent.quiz[s.q],answer=s.answers[s.q];return heading('06','把图讲清楚，才算真正抵达。','任选一题，由学生先独立判断，再邀请同伴解释错误选项的问题。')+`<div class="salon"><aside class="reflection"><span class="label">THE FOUR-WORD EXPLANATION</span><h2 style="margin-top:15px">给这束光，<br>写一段说明。</h2><p>试着不用背诵整段定义，只用四个关键词，讲清光合作用。</p><div class="line">① 场所：膜与基质怎样分工？</div><div class="line">② 物质：水、CO₂各去了哪里？</div><div class="line">③ 能量：ATP和NADPH如何连接？</div><div class="line">④ 条件：为什么光强不是越大越好？</div><p class="mini-note">八题均为原创课堂情境题，未冒称高考原题。可选四题当堂，其余留作学生自主复习。</p></aside><article class="quiz">${s.finished?`<span class="label">TODAY’S FIELD NOTES / COMPLETE</span><h2>完成八次解释。</h2><p>本轮判断正确 ${s.answers.filter((a,i)=>a===PhotoContent.quiz[i].answer).length} / ${PhotoContent.quiz.length} 题。</p><div class="callout">最后一句：能量可以被转化，原子需要被追踪。</div><p class="mini-note">再选一张图，由同学用“因为……所以……但这个模型没有……”作结。</p>${btn('quiz-reset','再挑战一次 ↻','primary')}`:`<span class="label">CLASSROOM CONVERSATION / 0${s.q+1} OF 08</span><h2>${esc(q.stem)}</h2>${choice(q.options,'quiz-answer',answer,q.answer,'two-col')}${answer!==null?`<p class="feedback ${answer===q.answer?'':'wrong'}">${answer===q.answer?'✓ 判断正确。':'正确选项是 '+String.fromCharCode(65+q.answer)+'。'}${esc(q.explanation)}</p>`:'<p class="mini-note">你的依据是什么？请先指出对应的图或实验条件。</p>'}<div class="quiz-actions">${btn('quiz-prev','← 上一题','',s.q===0?'disabled':'')}${btn('quiz-next',s.q===7?'完成本轮 →':'下一题 →','primary',answer===null?'disabled':'')}</div><div class="quiz-dots">${s.answers.map(a=>`<i class="${a===null?'':'done'}"></i>`).join('')}</div>`}</article></div>`;}
function render(){const previous=document.activeElement?.dataset,action=previous?.do,num=previous?.n,key=previous?.key;$('#chapterNav').innerHTML=rooms.map((n,i)=>btn('room',`<span>0${i+1}</span>${n}`,'',`data-n="${i}" ${s.room===i?'aria-current="page"':''}`)).join('');$('#room').innerHTML=[lightRoom,pigmentRoom,theaterRoom,evidenceRoom,greenhouseRoom,salonRoom][s.room]();$('#roomCount').textContent=`0${s.room+1} / 06`;$('[data-do="previous"]').disabled=s.room===0;$('[data-do="next"]').disabled=s.room===5;if(s.room===4)updateGreenhouse();if(action){const e=[...document.querySelectorAll('[data-do]')].find(e=>e.dataset.do===action&&e.dataset.n===num&&e.dataset.key===key);if(e&&!e.disabled)e.focus({preventScroll:true});}}
function stop(){clearInterval(timer);timer=null;s.playing=false;}
function room(n){stop();s.bandMotion=false;s.room=Math.max(0,Math.min(5,n));render();}
function play(){if(s.playing){stop();render();return;}if(s.step===3)s.step=0;s.playing=true;render();timer=setInterval(()=>{s.step++;if(s.step>=3){s.step=3;stop();}render();},3600);}
function dialog(type){stop();render();const guide=type==='guide';$('#modalLabel').textContent=guide?'A CLASSROOM FIELD GUIDE':'SCIENCE & ORIGINAL MODELS';$('#modalTitle').textContent=guide?'让学生成为解释者。':'科学依据与模型边界';$('#modalBody').innerHTML=guide?`<p class="callout">当前区域：${rooms[s.room]}。请让学生先说预测，再操作，最后解释“观察能支持什么”。</p><h3>这次换一种课堂组织</h3><p>它是一册可操作的温室观察簿：选光、排序、看剧场、作预测、调条件、开沙龙。可按两个课时展开，或走45分钟核心路线：色素8分钟、叶绿体过程18分钟、氧来源7分钟、净光合8分钟、归纳4分钟。</p><h3>三人协作，角色轮换</h3><ul><li>操作员：选择条件与步骤，操作前先预测。</li><li>证据员：指图、读现象或记录模型输出。</li><li>解释员：用场所、物质、能量和条件说明结论，再说一个边界。</li></ul><h3>各知识点教师提示</h3>${PhotoContent.teacherNotes.map(n=>`<details><summary>${esc(n.title)}</summary><p><b>追问：</b>${esc(n.prompt)}</p><p><b>期望解释：</b>${esc(n.expected)}</p><p>${esc(n.detail)}</p></details>`).join('')}<p>左右方向键切换学习区域。焦点位于按钮、滑条等控件或对话框中时保留原操作。切换区域、打开资料或页面进入后台时，过程演示自动暂停；学习状态仅在本次打开期间保留。</p>`:`<p class="callout">${esc(PhotoContent.scopeNote)}</p><h3>本课怎样简化科学过程？</h3><ul><li>所有二维图形与交互独立绘制，没有把课本截图作为结构模型。真实叶绿体膜网络更复杂，尺寸、颜色、箭头、图标与秒数均为示意。</li><li>选灯只作吸收、反射与透过的定性解释，不用光线粗细比较真实光子通量；也不把色素吸收光谱等同完整叶片的作用光谱。绿光利用不为零。</li><li>层析图只概括教材典型条件下的四条色带，不提供固定Rf值。分离与样品、溶剂、固定相及操作有关，不按分子质量简单排序。</li><li>光反应形成ATP、NADPH。暗反应以卡尔文循环为主，ATP也参与C₅再生；“部分碳输出”不是固定一次CO₂就净输出一个C₃。详见剧场进阶碳账。</li><li>氧同位素图是短时证据逻辑的示意；¹⁸O稳定、非放射性，不承诺100%标记或无同位素交换。实验并非图中几个气泡就可定量重建。</li><li>温室是明确规则的整数相对模型，净＝总−呼吸；参数完全为教学设定。计量基准一致，并省略光呼吸等过程，不把模型结果用于真实产量预测。</li></ul><h3>教材与科学参考</h3><ul class="source-list">${PhotoContent.references.map(r=>`<li><a href="${r.url}" target="_blank" rel="noopener">${esc(r.title)} ↗</a><small>${esc(r.note)}</small></li>`).join('')}<li><a href="https://edu.rsc.org/mixtures-and-separation/leaf-chromatography/389.article" target="_blank" rel="noopener">Royal Society of Chemistry · Leaf chromatography ↗</a><small>核对固定相、流动相与色素迁移的关系。</small></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5933133/" target="_blank" rel="noopener">Gauthier 等 · H₂¹⁸O 标记与光合气体交换，2018 ↗</a><small>原始研究：水标记与产氧、总/净交换的联系。未借用其测量数字。</small></li></ul><h3>教学组织参考</h3><ul class="source-list"><li><a href="https://www.biointeractive.org/classroom-resources/photosynthesis" target="_blank" rel="noopener">HHMI BioInteractive · Photosynthesis ↗</a><small>参考从叶片到叶绿体、再联系能量流的多尺度组织。未嵌入其原图或动画。</small></li><li><a href="https://www.saps.org.uk/teaching-resources/resources/827/video-clip-plant-adaptations-to-overcome-environmental-limitations/" target="_blank" rel="noopener">SAPS · Plant adaptations and environmental limitations ↗</a><small>参考改变单一环境条件、解释限制因素的课堂探究方式。</small></li></ul><p class="mini-note">单文件离线运行。以上链接只在查阅资料时需联网。题目为原创，旧版课件全部保留，新文件为独立v1.0。</p>`;$('#dialog').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b||b.disabled)return;const a=b.dataset.do,n=Number(b.dataset.n),k=b.dataset.key;s.bandMotion=false;switch(a){case'room':room(n);return;case'previous':room(s.room-1);return;case'next':room(s.room+1);return;case'guide':case'sources':dialog(a);return;case'close':$('#dialog').close();return;case'focus':s.focus=!s.focus;document.body.classList.toggle('focus',s.focus);$('#focusButton').setAttribute('aria-pressed',s.focus);$('#focusButton').textContent=s.focus?'恢复字号 Aa':'放大字号 Aa';return;case'light':s.light=k;break;case'pigment':if(!s.order.includes(n)&&s.order.length<4)s.order.push(n);break;case'remove':s.order.splice(n,1);break;case'develop':s.revealed=true;s.bandMotion=true;break;case'pigment-reset':s.order=[];s.revealed=false;break;case'step':stop();s.step=n;break;case'play':play();return;case'stage-answer':s.stepsAnswers[s.step]=n;break;case'prediction':s.prediction=n;break;case'reveal-evidence':s.evidence=true;break;case'reset-evidence':s.evidence=false;s.prediction=null;break;case'temperature':s.T=k;break;case'dark':s.L=0;break;case'greenhouse-reset':s.L=65;s.C=60;s.T='fit';s.task=0;break;case'task':s.task=n;s.T='fit';s.C=n===1?60:20;s.L=n===1?0:90;break;case'record':if(s.records.length<6)s.records.push(PhotoDraw.exchange({light:s.L,carbon:s.C,temperature:s.T}));break;case'clear-records':s.records=[];break;case'quiz-answer':s.answers[s.q]=n;break;case'quiz-prev':s.q=Math.max(0,s.q-1);break;case'quiz-next':if(s.q<7)s.q++;else s.finished=true;break;case'quiz-reset':s.q=0;s.answers.fill(null);s.finished=false;break;}render();});
document.addEventListener('input',e=>{const param=e.target.dataset.param;if(!param)return;s[param]=Number(e.target.value);updateGreenhouse();});document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('paused',document.hidden);if(document.hidden&&s.playing){stop();render();}});document.addEventListener('keydown',e=>{if($('#dialog').open||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||/^(BUTTON|INPUT|SELECT|TEXTAREA|A|SUMMARY)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable||window.getSelection()?.toString())return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();room(s.room+(e.key==='ArrowRight'?1:-1));}});render();
})();
</script></body></html>
